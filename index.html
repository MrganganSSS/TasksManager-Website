<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple tasks manager that saves your tasks locally in your browser.">
  <title>Tasks Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">Tasks Manager</h1>
      <p class="app-subtitle" id="app-subtitle">0 tasks left</p>
    </header>

    <form class="task-form" id="task-form" autocomplete="off">
      <label for="task-input" class="visually-hidden">Add a new task</label>
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="What needs to be done?"
        maxlength="200"
        required
      >
      <button type="submit" class="task-add" id="task-add" aria-label="Add task">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="active">Active</button>
      <button type="button" class="filter" data-filter="completed">Completed</button>
    </div>

    <section class="tasks-section">
      <p class="empty" id="empty" hidden>No tasks yet. Add one above!</p>
      <ul class="task-list" id="task-list" aria-live="polite"></ul>
    </section>

    <footer class="app-footer">
      <button type="button" class="clear-completed" id="clear-completed">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
